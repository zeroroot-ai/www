server {
    # ${NGINX_PORT} is templated at container start by the nginx-unprivileged
    # image's 20-envsubst-on-templates.sh (this file ships as
    # /etc/nginx/templates/default.conf.template). The deploy chart
    # (helm/saas-overlay/www-svc) runs the pod as uid 101 with no
    # NET_BIND_SERVICE, so a privileged port cannot be bound; it sets
    # NGINX_PORT=8080 and dials the container on that port. The image default
    # below keeps a plain `docker run` working.
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This server sits behind the edge proxy, which terminates TLS on 443 and
    # forwards here on ${NGINX_PORT}. So nginx must never build an absolute
    # redirect: it only knows its own scheme and port, and would send the
    # browser to http://<host>:8080/... — an internal address the client
    # cannot reach. Relative redirects keep whatever scheme, host and port the
    # client actually used.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        # Resolve a clean URL straight to the file Astro emitted for it, so
        # /pricing serves pricing/index.html directly instead of 301-ing to
        # /pricing/ first. One fewer round trip, and no redirect to get wrong.
        #
        # There is deliberately NO catch-all to /index.html. The previous
        # config ended with `/index.html =404`, which meant every unknown path
        # answered 200 with the landing page — so a stale link like /docs
        # rendered the home page instead of failing, which reads as "the site
        # is serving the wrong thing" rather than "that page does not exist".
        # Unknown paths now 404.
        try_files $uri $uri.html $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
