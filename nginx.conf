server {
    # ${NGINX_PORT} is templated at container start by the nginx-unprivileged
    # image's 20-envsubst-on-templates.sh (this file ships as
    # /etc/nginx/templates/default.conf.template). The deploy chart
    # (helm/saas-overlay/www-svc) runs the pod as uid 101 with no
    # NET_BIND_SERVICE, so a privileged port cannot be bound; it sets
    # NGINX_PORT=8080 and dials the container on that port. The image default
    # below keeps a plain `docker run` working.
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
