# pnpm 11 requires an explicit decision on every dependency that wants to run a
# postinstall script, and errors out (ERR_PNPM_IGNORED_BUILDS) until it gets
# one. pnpm 10 only warned, which is why this file did not exist before.
#
# Both are `false` — this site does not need either script:
#   esbuild — ships its native binary as a platform-specific optional
#             dependency; the postinstall only verifies it. Astro/Vite build
#             fine without it, as the image build proves.
#   sharp   — used by astro:assets for image optimisation. These pages use a
#             plain <img>, so sharp is never invoked.
#
# The Dockerfile installs with --ignore-scripts, so this keeps CI, the image
# and a workstation making the same choice instead of three different ones.
allowBuilds:
  esbuild: false
  sharp: false
# pnpm 11 quarantines any package published in the last 24h. That protects
# against a compromised third-party publish being pulled in before anyone
# notices — which is not the risk profile of our own scope: we publish it, from
# this org, and the release that produced it is the one we just merged.
#
# Excluded by scope rather than by version on purpose. A pinned
# `@zeroroot-ai/brand@0.3.0` entry would have to be re-pinned on every single
# brand release, and an allowlist that needs re-pinning after an unrelated
# change is a defect in the allowlist, not a chore.
minimumReleaseAgeExclude:
  - '@zeroroot-ai/*'
