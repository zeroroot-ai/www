name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads package.json's
      # `packageManager` field instead, so CI, the Docker image and a
      # workstation all run the identical pnpm. They did not before: CI
      # pinned 9, the image floated to latest (11), and a developer had
      # whatever they had installed — which is how a lockfile that resolved
      # fine locally was rejected by the image.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zeroroot"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    # Runs on pull requests too, building without pushing. The job used to be
    # gated on main, so the image was only ever built after merge — three
    # separate image-only breakages (a floating pnpm that rejected the
    # lockfile, redirects to the internal port, and a try_files catch-all
    # that answered 200 for every unknown path) all passed PR CI and only
    # showed up on a cluster. `pnpm build` succeeding is not evidence that
    # the shipped artifact works.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Push only from main; a pull request proves the image builds and
          # stops there, so a fork PR cannot publish to the registry.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/zeroroot-ai/www:${{ github.sha }}
            ghcr.io/zeroroot-ai/www:latest
          # BuildKit secret (not a build-arg/ENV) so the GH Packages token
          # used to fetch @zeroroot-ai/brand is never baked into a layer.
          # The Dockerfile mounts it and writes a user-level ~/.npmrc for
          # the pnpm install step only (see issue #3).
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
