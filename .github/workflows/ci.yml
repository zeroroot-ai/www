name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # packages: read is required here (not just in docker below): pnpm
    # install fetches @zeroroot-ai/brand from npm.pkg.github.com using
    # GITHUB_TOKEN as NODE_AUTH_TOKEN, which needs package-read scope.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` here on purpose. The action reads package.json's
      # `packageManager` field instead, so CI, the Docker image and a
      # workstation all run the identical pnpm. They did not before: CI
      # pinned 9, the image floated to latest (11), and a developer had
      # whatever they had installed — which is how a lockfile that resolved
      # fine locally was rejected by the image.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zeroroot"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    # Runs on pull requests too, building without pushing. The job used to be
    # gated on main, so the image was only ever built after merge — three
    # separate image-only breakages (a floating pnpm that rejected the
    # lockfile, redirects to the internal port, and a try_files catch-all
    # that answered 200 for every unknown path) all passed PR CI and only
    # showed up on a cluster. `pnpm build` succeeding is not evidence that
    # the shipped artifact works.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # Push only from main; a pull request proves the image builds and
          # stops there, so a fork PR cannot publish to the registry.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/zeroroot-ai/www:${{ github.sha }}
            ghcr.io/zeroroot-ai/www:latest
          # BuildKit secret (not a build-arg/ENV) so the GH Packages token
          # used to fetch @zeroroot-ai/brand is never baked into a layer.
          # The Dockerfile mounts it and writes a user-level ~/.npmrc for
          # the pnpm install step only (see issue #3).
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      # Build-only checks miss runtime failures (see the job comment above);
      # the #17 EACCES crashloop shipped because the artifact was never RUN.
      # Boot the image exactly as the chart does (uid 101 by base USER) with
      # substitution env and assert the served HTML: substituted origins in,
      # sentinels gone. A container that dies at start fails the curl loop.
      - name: Smoke-run the image with substituted origins
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -t www-smoke --secret id=npm_token,env=NPM_TOKEN .
          docker run -d --name www-smoke -p 8080:8080 \
            -e APP_ORIGIN=https://app.staging.example \
            -e DOCS_ORIGIN=https://docs.staging.example \
            www-smoke
          for i in $(seq 1 30); do
            curl -fsm2 http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          docker logs www-smoke
          H=$(curl -fsm5 http://localhost:8080/)
          echo "$H" | grep -q 'https://app.staging.example/login' || { echo "FAIL: substituted app origin missing"; exit 1; }
          echo "$H" | grep -q 'https://docs.staging.example' || { echo "FAIL: substituted docs origin missing"; exit 1; }
          if echo "$H" | grep -q '__APP_ORIGIN__\|__DOCS_ORIGIN__'; then echo "FAIL: sentinels leaked"; exit 1; fi
          echo "smoke OK: substituted origins served"
