name: Release Please

on:
  push:
    branches: [main]

# The job runs release-please with RELEASE_PLEASE_TOKEN, so the default
# GITHUB_TOKEN needs nothing beyond read. The job scope below is what the
# action falls back to if that secret is ever empty.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
